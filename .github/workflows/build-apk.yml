name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o "AutoPocketSignalAPK (1).zip" -d project
          sed -i '/repositoriesMode.set/d' project/settings.gradle
          sed -i '/RepositoriesMode/d' project/settings.gradle

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoPocketSignal-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
