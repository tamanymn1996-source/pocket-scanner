<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pocket Scanner</title>

<!-- Tesseract.js for OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f1115;
  color: white;
  min-height: 100vh;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 20px 16px;
}

h1 {
  text-align: center;
  margin: 10px 0;
  font-size: 30px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  margin-bottom: 22px;
}

.scanner {
  background: #191d24;
  border: 1px solid #303640;
  border-radius: 18px;
  padding: 16px;
}

.preview {
  height: 300px;
  border: 2px dashed #555;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #888;
  text-align: center;
  line-height: 1.6;
}

video {
  width: 100%;
  height: 300px;
  object-fit: cover;
  background: #050608;
  border-radius: 14px;
  display: none;
}

canvas {
  width: 100%;
  border-radius: 14px;
  display: none;
  margin-top: 15px;
  background: white;
}

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 14px;
  margin-top: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#startBtn { background: #2563eb; color: white; }
#captureBtn { background: #16a34a; color: white; display: none; }
#retakeBtn { background: #f59e0b; color: white; display: none; }
#cleanBtn { background: #7c3aed; color: white; display: none; }
#downloadBtn { background: #0891b2; color: white; display: none; }
#stopBtn { background: #dc2626; color: white; display: none; }
#ocrBtn { background: #475569; color: white; display: none; }

#result {
  text-align: center;
  color: #bbb;
  margin: 15px 0 5px;
  min-height: 22px;
}

#textResult {
  width: 100%;
  height: 180px;
  margin-top: 12px;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #303640;
  background: #0f1115;
  color: white;
  font-size: 16px;
  resize: vertical;
  display: none;
}
</style>
</head>

<body>
<div class="container">
  <h1>📷 Pocket Scanner</h1>
  <div class="subtitle">Scan documents and extract text</div>

  <div class="scanner">

    <div id="preview" class="preview">
      📄<br>
      Press "Start Scanner" to open your camera.
    </div>

    <video id="camera" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <button id="startBtn" onclick="startScanner()">📷 Start Scanner</button>
    <button id="captureBtn" onclick="capturePhoto()">📸 Capture</button>
    <button id="retakeBtn" onclick="retakePhoto()">🔄 Retake</button>
    <button id="cleanBtn" onclick="cleanPhoto()">✨ Clean Image</button>
    <button id="ocrBtn" onclick="extractText()">📝 Extract Text</button>
    <button id="downloadBtn" onclick="downloadPhoto()">⬇️ Download</button>
    <button id="stopBtn" onclick="stopScanner()">⏹ Stop Scanner</button>

    <textarea id="textResult"
      placeholder="Extracted text will appear here..."></textarea>

    <div id="result">Scanner ready.</div>
  </div>
</div>

<script>
let stream = null;

async function startScanner() {
  const video = document.getElementById("camera");
  const preview = document.getElementById("preview");

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" }
      },
      audio: false
    });

    video.srcObject = stream;

    preview.style.display = "none";
    video.style.display = "block";

    document.getElementById("startBtn").style.display = "none";
    document.getElementById("captureBtn").style.display = "block";
    document.getElementById("stopBtn").style.display = "block";
    document.getElementById("result").innerText =
      "📷 Camera is ready.";

  } catch (error) {
    console.error(error);
    document.getElementById("result").innerText =
      "❌ Camera permission denied or camera unavailable.";
  }
}

function capturePhoto() {
  const video = document.getElementById("camera");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  if (!video.videoWidth || !video.videoHeight) {
    document.getElementById("result").innerText =
      "❌ Camera is not ready yet.";
    return;
  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  video.style.display = "none";
  canvas.style.display = "block";

  document.getElementById("captureBtn").style.display = "none";
  document.getElementById("retakeBtn").style.display = "block";
  document.getElementById("cleanBtn").style.display = "block";
  document.getElementById("ocrBtn").style.display = "block";
  document.getElementById("downloadBtn").style.display = "block";

  document.getElementById("result").innerText =
    "✅ Photo captured.";

  stopCameraOnly();
}

function retakePhoto() {
  document.getElementById("canvas").style.display = "none";
  document.getElementById("retakeBtn").style.display = "none";
  document.getElementById("cleanBtn").style.display = "none";
  document.getElementById("downloadBtn").style.display = "none";
  document.getElementById("ocrBtn").style.display = "none";
  document.getElementById("textResult").style.display = "none";

  startScanner();
}

function cleanPhoto() {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const imageData = ctx.getImageData(
    0, 0, canvas.width, canvas.height
  );

  const data = imageData.data;

  for (let i = 0; i < data.length; i += 4) {
    const average =
      (data[i] + data[i + 1] + data[i + 2]) / 3;

    data[i] = average;
    data[i + 1] = average;
    data[i + 2] = average;
  }

  ctx.putImageData(imageData, 0, 0);

  document.getElementById("result").innerText =
    "✨ Image cleaned and converted to grayscale.";
}

async function extractText() {
  const canvas = document.getElementById("canvas");
  const result = document.getElementById("result");
  const textBox = document.getElementById("textResult");

  textBox.style.display = "block";
  textBox.value = "";
  result.innerText = "📝 Reading text... Please wait.";

  try {
    const worker = await Tesseract.createWorker("eng");

    const { data: { text } } =
      await worker.recognize(canvas);

    textBox.value = text.trim();

    await worker.terminate();

    result.innerText =
      "✅ Text extracted successfully.";

  } catch (error) {
    console.error(error);
    result.innerText =
      "❌ OCR failed. Try taking a clearer photo.";
  }
}

function downloadPhoto() {
  const canvas = document.getElementById("canvas");

  if (!canvas.width || !canvas.height) {
    document.getElementById("result").innerText =
      "❌ Capture a document first.";
    return;
  }

  const link = document.createElement("a");
  link.download = "pocket-scanner-document.png";
  link.href = canvas.toDataURL("image/png");
  link.click();

  document.getElementById("result").innerText =
    "⬇️ Document downloaded.";
}

function stopCameraOnly() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
}

function stopScanner() {
  stopCameraOnly();

  document.getElementById("camera").style.display = "none";
  document.getElementById("canvas").style.display = "none";
  document.getElementById("preview").style.display = "flex";

  document.getElementById("startBtn").style.display = "block";
  document.getElementById("captureBtn").style.display = "none";
  document.getElementById("retakeBtn").style.display = "none";
  document.getElementById("cleanBtn").style.display = "none";
  document.getElementById("downloadBtn").style.display = "none";
  document.getElementById("stopBtn").style.display = "none";
  document.getElementById("ocrBtn").style.display = "none";
  document.getElementById("textResult").style.display = "none";

  document.getElementById("result").innerText =
    "Scanner ready.";
}
</script>

</body>
</html>
