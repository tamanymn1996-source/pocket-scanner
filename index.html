<body>

<div class="wrap">
<div class="card">

<h1>📊 Auto Pocket Signal PRO+</h1>

<div class="sub">
Smart 1-Minute Technical Signal
</div>

<label>🔑 Twelve Data API Key</label>

<input
id="apiKey"
type="password"
placeholder="Paste your API key"
>

<label>💱 Asset</label>

<select id="asset">
<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>AUD/USD</option>
<option>USD/CAD</option>
<option>USD/CHF</option>
</select>

<button id="startBtn" onclick="toggleAuto()">
▶ START AUTO SIGNAL
</button>

<div class="signal" id="signal">
WAITING...
</div>

<div class="count" id="countdown"></div>

<div class="grid">

<div class="box">
Price
<strong id="price">—</strong>
</div>

<div class="box">
Asset
<strong id="assetShow">—</strong>
</div>

<div class="box">
RSI
<strong id="rsi">—</strong>
</div>

<div class="box">
EMA 9
<strong id="ema9">—</strong>
</div>

<div class="box">
EMA 21
<strong id="ema21">—</strong>
</div>

<div class="box">
Trend
<strong id="trend">—</strong>
</div>

<div class="box">
Candle
<strong id="candle">—</strong>
</div>

<div class="box">
Momentum
<strong id="momentum">—</strong>
</div>

<div class="box">
Strength
<strong id="strength">—</strong>
</div>

<div class="box">
Score
<strong id="score">—</strong>
</div>

</div>

Not started
</div>

<small>
⚠️ Technical estimates only.
No strategy guarantees profit.
Signals are not financial advice.
</small>

</div>
</div>


<script>

let timer=null;
let countdownTimer=null;
let seconds=0;


/* =========================
   EMA
========================= */

function calculateEMA(values,period){

if(values.length<period){
return null;
}

let ema=
values
.slice(0,period)
.reduce((a,b)=>a+b,0)/period;

let multiplier=
2/(period+1);

for(let i=period;i<values.length;i++){

ema=
((values[i]-ema)*multiplier)+ema;

}

return ema;

}


/* =========================
   RSI
========================= */

function calculateRSI(values,period=14){

if(values.length<period+1){
return null;
}

let gains=0;
let losses=0;

for(let i=1;i<=period;i++){

let diff=
values[i]-values[i-1];

if(diff>0){
gains+=diff;
}else{
losses+=Math.abs(diff);
}

}

let avgGain=gains/period;
let avgLoss=losses/period;

for(
let i=period+1;
i<values.length;
i++
){

let diff=
values[i]-values[i-1];

let gain=
diff>0?diff:0;

let loss=
diff<0?Math.abs(diff):0;

avgGain=
((avgGain*(period-1))+gain)/period;

avgLoss=
((avgLoss*(period-1))+loss)/period;

}

if(avgLoss===0){
return 100;
}

let rs=
avgGain/avgLoss;

return 100-(100/(1+rs));

}


/* =========================
   DATA
========================= */

async function getData(){

const key=
document
.getElementById("apiKey")
.value
.trim();

const asset=
document
.getElementById("asset")
.value;


if(!key){

document
.getElementById("signal")
.innerHTML=
'<span class="wait">⚠️ API KEY پێویستە</span>';

return;

}


document
.getElementById("status")
.textContent=
"🔄 Analyzing market...";


try{

const url=
"https://api.twelvedata.com/time_series"+
"?symbol="+
encodeURIComponent(asset)+
"&interval=1min"+
"&outputsize=100"+
"&timezone=UTC"+
"&apikey="+
encodeURIComponent(key);


const response=
await fetch(url);

const data=
await response.json();


if(data.status==="error"){

throw new Error(
data.message||"API error"
);

}


if(
!data.values||
data.values.length<35
){

throw new Error(
"Not enough candle data"
);

}


/*
Newest candle can still be forming.
Use closed candles.
*/

const candles=
data.values.slice(1);


/* newest closed candle */

const latest=
candles[0];

const previous=
candles[1];

const closes=
candles
.map(x=>Number(x.close))
.reverse();


const price=
Number(latest.close);


const open=
Number(latest.open);

const high=
Number(latest.high);

const low=
Number(latest.low);


const previousClose=
Number(previous.close);


const ema9=
calculateEMA(closes,9);

const ema21=
calculateEMA(closes,21);

const RSI=
calculateRSI(closes);


if(
ema9===null||
ema21===null||
RSI===null
){

throw new Error(
"Indicator calculation failed"
);

}


/* =========================
   CANDLE
========================= */

let candleDirection="NEUTRAL";

if(price>open){

candleDirection="BULLISH";

}

else if(price<open){

candleDirection="BEARISH";

}


/* =========================
   MOMENTUM
========================= */

let momentum="NEUTRAL";

if(price>previousClose){

momentum="UP";

}

else if(price<previousClose){

momentum="DOWN";

}


/* =========================
   TREND
========================= */

let trend="SIDEWAYS";

if(ema9>ema21){

trend="UP";

}

else if(ema9<ema21){

trend="DOWN";

}


/* =========================
   SMART SCORE
========================= */

let callScore=0;
let putScore=0;


/*
EMA trend
*/

if(ema9>ema21){

callScore+=2;

}

else if(ema9<ema21){

putScore+=2;

}


/*
Price vs EMA21
*/

if(price>ema21){

callScore+=1;

}

else if(price<ema21){

putScore+=1;

}


/*
RSI
*/

if(RSI>=52 && RSI<=68){

callScore+=2;

}

else if(RSI>=32 && RSI<=48){

putScore+=2;

}


/*
Momentum
*/

if(momentum==="UP"){

callScore+=1;

}

else if(momentum==="DOWN"){

putScore+=1;

}


/*
Candle confirmation
*/

if(candleDirection==="BULLISH"){

callScore+=1;

}

else if(candleDirection==="BEARISH"){

putScore+=1;

}


/* =========================
   SIGNAL DECISION
========================= */

let signal="WAIT";
let className="wait";
let confidence=55;
let strength="WEAK";

const difference=
Math.abs(callScore-putScore);


/*
CALL
*/

if(
callScore>=5 &&
callScore>putScore
){

signal="CALL";
className="up";

confidence=
70+
Math.min(difference*4,15);

if(callScore>=7){

strength="STRONG";

}else{

strength="MEDIUM";

}

}


/*
PUT
*/

else if(
putScore>=5 &&
putScore>callScore
){

signal="PUT";
className="down";

confidence=
70+
Math.min(difference*4,15);

if(putScore>=7){

strength="STRONG";

}else{

strength="MEDIUM";

}

}


/* =========================
   DISPLAY SIGNAL
========================= */

document
.getElementById("signal")
.innerHTML=

'<div>NEW SIGNAL</div>'+

'<b class="'+
className+
'">'+

(
signal==="CALL"
?"🟢 "
:
signal==="PUT"
?"🔴 "
:"🟡 "
)+

signal+

'</b>'+

'<div>Confidence: '+
confidence+
'%</div>';


/* =========================
   DISPLAY DATA
========================= */

document
.getElementById("price")
.textContent=
price.toFixed(5);


document
.getElementById("assetShow")
.textContent=
asset;


document
.getElementById("rsi")
.textContent=
RSI.toFixed(1);


document
.getElementById("ema9")
.textContent=
ema9.toFixed(5);


document
.getElementById("ema21")
.textContent=
ema21.toFixed(5);


document
.getElementById("trend")
.textContent=
trend;


document
.getElementById("candle")
.textContent=
candleDirection;


document
.getElementById("momentum")
.textContent=
momentum;


document
.getElementById("strength")
.textContent=
strength;


document
.getElementById("score")
.textContent=
callScore+
" / "+
putScore;


document
.getElementById("status")
.textContent=
"🟢 LIVE • Updated "+
new Date()
.toLocaleTimeString();


seconds=60;

}

catch(error){

document
.getElementById("status")
.textContent=
"❌ "+
error.message;

document
.getElementById("signal")
.innerHTML=
'<span class="wait">'+
'⚠️ DATA ERROR'+
'</span>';

}

}


/* =========================
   START / STOP
========================= */

function toggleAuto(){

const button=
document
.getElementById("startBtn");


/* STOP */

if(timer){

clearInterval(timer);
clearInterval(countdownTimer);

timer=null;
countdownTimer=null;

button.textContent=
"▶ START AUTO SIGNAL";

button.className="";

document
.getElementById("status")
.textContent=
"Stopped";

document
.getElementById("countdown")
.textContent="";

return;

}


/* START */

getData();

seconds=60;


timer=
setInterval(
function(){

getData();

seconds=60;

},
60000
);


countdownTimer=
setInterval(
function(){

if(seconds>0){

seconds--;

}

document
.getElementById("countdown")
.textContent=
"⏱️ Next analysis: "+
seconds+
"s";

},
1000
);


button.textContent=
"■ STOP AUTO SIGNAL";

button.className=
"stop";


document
.getElementById("status")
.textContent=
"🟢 AUTO SIGNAL STARTED";

}

</script>

</body>
</html>
