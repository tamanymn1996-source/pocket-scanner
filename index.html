<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Pocket Signal PRO</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0b0e13;
color:#fff;
font-family:Arial,sans-serif
}

.wrap{
max-width:560px;
margin:auto;
padding:16px
}

.card{
background:#181d25;
border:1px solid #303744;
border-radius:20px;
padding:18px
}

h1{
text-align:center;
margin:6px 0;
font-size:30px
}

.sub{
text-align:center;
color:#9ca3af;
margin-bottom:18px
}

label{
display:block;
color:#c5cad3;
margin:12px 0 6px
}

input,select,button{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #3b4350;
font-size:16px
}

input,select{
background:#0d1015;
color:#fff
}

button{
margin-top:16px;
background:#2563eb;
color:#fff;
border:0;
font-weight:700
}

button.stop{
background:#dc2626
}

.signal{
margin-top:18px;
text-align:center;
padding:20px;
border-radius:16px;
background:#0d1015
}

.signal b{
font-size:38px;
display:block;
margin:7px
}

.up{color:#22c55e}
.down{color:#ef4444}
.wait{color:#f59e0b}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:14px
}

.box{
background:#0d1015;
padding:13px;
border-radius:11px;
text-align:center;
color:#9ca3af
}

.box strong{
display:block;
color:#fff;
font-size:18px;
margin-top:5px
}

.status{
text-align:center;
margin-top:13px;
color:#60a5fa
}

.count{
text-align:center;
color:#fbbf24;
margin-top:8px;
font-weight:bold
}

small{
display:block;
color:#858b96;
text-align:center;
margin-top:14px;
line-height:1.5
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<h1>📊 Auto Pocket Signal PRO</h1>

<div class="sub">
Live 1-Minute Technical Signal
</div>

<label>🔑 Twelve Data API Key</label>

<input
id="apiKey"
type="password"
placeholder="Paste your API key"
>

<label>💱 Asset</label>

<select id="asset">
<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>AUD/USD</option>
<option>USD/CAD</option>
<option>USD/CHF</option>
</select>

<button id="startBtn" onclick="toggleAuto()">
▶ START AUTO SIGNAL
</button>

<div class="signal" id="signal">
WAITING...
</div>

<div class="count" id="countdown"></div>

<div class="grid">

<div class="box">
Price
<strong id="price">—</strong>
</div>

<div class="box">
Asset
<strong id="a">—</strong>
</div>

<div class="box">
RSI
<strong id="rsi">—</strong>
</div>

<div class="box">
EMA 9
<strong id="ema9">—</strong>
</div>

<div class="box">
EMA 21
<strong id="ema21">—</strong>
</div>

<div class="box">
Trend
<strong id="trend">—</strong>
</div>

<div class="box">
Strength
<strong id="strength">—</strong>
</div>

<div class="box">
Updated
<strong id="updated">—</strong>
</div>

</div>

<div class="status" id="status">
Not started
</div>

<small>
⚠️ Technical estimates only.
No signal guarantees profit.
This app generates signals only and does not place trades.
</small>

</div>
</div>

<script>

let timer=null;
let countdownTimer=null;
let seconds=0;


/* EMA */

function ema(v,p){

if(v.length<p)return null;

let e=
v.slice(0,p)
.reduce((a,b)=>a+b,0)/p;

let m=2/(p+1);

for(let i=p;i<v.length;i++){

e=(v[i]-e)*m+e;

}

return e;

}


/* RSI */

function rsi(v,p=14){

if(v.length<p+1)return null;

let g=0;
let l=0;

for(let i=1;i<=p;i++){

let d=v[i]-v[i-1];

if(d>0){
g+=d;
}else{
l-=d;
}

}

let ag=g/p;
let al=l/p;

for(let i=p+1;i<v.length;i++){

let d=v[i]-v[i-1];

let gg=d>0?d:0;
let ll=d<0?-d:0;

ag=(ag*(p-1)+gg)/p;
al=(al*(p-1)+ll)/p;

}

if(al===0)return 100;

return 100-100/(1+ag/al);

}


/* GET MARKET DATA */

async function getData(){

const key=
document.getElementById("apiKey")
.value.trim();

const asset=
document.getElementById("asset")
.value;


if(!key){

document.getElementById("signal")
.innerHTML=
'<span class="wait">⚠️ API KEY پێویستە</span>';

return;

}


document.getElementById("status")
.textContent=
"🔄 Getting market data...";


try{

const url=
"https://api.twelvedata.com/time_series"+
"?symbol="+
encodeURIComponent(asset)+
"&interval=1min"+
"&outputsize=100"+
"&timezone=UTC"+
"&apikey="+
encodeURIComponent(key);


const response=
await fetch(url);

const data=
await response.json();


if(data.status==="error"){

throw new Error(
data.message||"API error"
);

}


if(!data.values||
data.values.length<30){

throw new Error(
"Not enough candle data"
);

}


/*
Newest candle may still be forming,
so skip it.
*/

const candles=
data.values.slice(1);


const closes=
candles
.map(x=>Number(x.close))
.reverse();


const price=
Number(candles[0].close);


const ema9=
ema(closes,9);


const ema21=
ema(closes,21);


const RSI=
rsi(closes);


if(
ema9===null||
ema21===null||
RSI===null
){

throw new Error(
"Indicator calculation failed"
);

}


/* SIGNAL SCORE */

let score=0;


/* EMA trend */

if(ema9>ema21){

score++;

}else if(ema9<ema21){

score--;

}


/* RSI */

if(RSI>=50 && RSI<70){

score++;

}else if(RSI<=50 && RSI>30){

score--;

}


/* PRICE VS EMA21 */

if(price>ema21){

score++;

}else if(price<ema21){

score--;

}


/* SIGNAL */

let signal="WAIT";
let className="wait";
let confidence=55;
let strength="WEAK";


if(score>=2){

signal="CALL";
className="up";

confidence=
70+
Math.min(score-2,2)*5;

strength=
score>=3?
"STRONG":
"MEDIUM";

}


else if(score<=-2){

signal="PUT";
className="down";

confidence=
70+
Math.min(
-score-2,
2
)*5;

strength=
-score>=3?
"STRONG":
"MEDIUM";

}


/* SHOW SIGNAL */

document.getElementById("signal")
.innerHTML=

'<div>NEW SIGNAL</div>'+

'<b class="'+className+'">'+

(
signal==="CALL"
?"🟢 "
:
signal==="PUT"
?"🔴 "
:"🟡 "
)+

signal+

'</b>'+

'<div>Confidence: '+
confidence+
'%</div>';


/* SHOW DATA */

document.getElementById("price")
.textContent=
price.toFixed(5);


document.getElementById("a")
.textContent=
asset;


document.getElementById("rsi")
.textContent=
RSI.toFixed(1);


document.getElementById("ema9")
.textContent=
ema9.toFixed(5);


document.getElementById("ema21")
.textContent=
ema21.toFixed(5);


document.getElementById("trend")
.textContent=

ema9>ema21
?"UP"
:
ema9<ema21
?"DOWN"
:"SIDEWAYS";


document.getElementById("strength")
.textContent=
strength;


document.getElementById("updated")
.textContent=
new Date()
.toLocaleTimeString();


document.getElementById("status")
.textContent=
"🟢 Live • Auto refresh: 60s";


seconds=60;


}

catch(error){

document.getElementById("status")
.textContent=
"❌ "+error.message;


document.getElementById("signal")
.innerHTML=
'<span class="wait">'+
'⚠️ DATA ERROR'+
'</span>';

}

}


/* START / STOP */

function toggleAuto(){

const button=
document.getElementById("startBtn");


/* STOP */

if(timer){

clearInterval(timer);
clearInterval(countdownTimer);

timer=null;
countdownTimer=null;

button.textContent=
"▶ START AUTO SIGNAL";

button.className="";

document.getElementById("status")
.textContent=
"Stopped";

document.getElementById("countdown")
.textContent="";

return;

}


/* START */

getData();

seconds=60;


timer=
setInterval(
()=>{
getData();
seconds=60;
},
60000
);


countdownTimer=
setInterval(
()=>{

if(seconds>0){
seconds--;
}

document.getElementById("countdown")
.textContent=
"Next update: "+
seconds+
"s";

},
1000
);


button.textContent=
"■ STOP AUTO SIGNAL";

button.className="stop";


document.getElementById("status")
.textContent=
"🟢 AUTO SIGNAL STARTED";

}

</script>

</body>
</html>
