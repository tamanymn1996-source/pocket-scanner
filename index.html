<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pocket Broker Signal</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#0f1115;
 color:#fff;
 font-family:Arial,sans-serif;
}

.wrap{
 max-width:520px;
 margin:auto;
 padding:18px;
}

.card{
 background:#191d24;
 border:1px solid #303640;
 border-radius:20px;
 padding:20px;
}

h1{
 text-align:center;
 margin:5px 0 4px;
 font-size:30px;
}

.sub{
 text-align:center;
 color:#aaa;
 margin-bottom:22px;
}

label{
 display:block;
 color:#bbb;
 font-size:18px;
 margin:15px 0 8px;
}

input,select{
 width:100%;
 padding:18px;
 border-radius:14px;
 border:1px solid #3b4250;
 background:#0d0f14;
 color:#fff;
 font-size:20px;
 outline:none;
}

button{
 width:100%;
 border:0;
 border-radius:15px;
 padding:18px;
 margin-top:22px;
 background:#2864e8;
 color:#fff;
 font-size:20px;
 font-weight:bold;
 cursor:pointer;
}

button:active{
 transform:scale(.98);
}

.result{
 margin-top:25px;
 background:#0d0f14;
 border-radius:20px;
 padding:25px 15px;
 text-align:center;
}

.signal-title{
 color:#ddd;
 font-size:20px;
}

.signal{
 font-size:58px;
 font-weight:bold;
 margin:10px 0;
}

.call{color:#20d061}
.put{color:#ff4141}
.wait{color:#ffc126}

.conf{
 font-size:20px;
 color:#ddd;
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:16px;
 margin-top:18px;
}

.box{
 background:#0d0f14;
 border-radius:16px;
 padding:18px 10px;
 text-align:center;
}

.box span{
 display:block;
 color:#aaa;
 font-size:18px;
 margin-bottom:10px;
}

.box strong{
 font-size:22px;
}

.note{
 margin-top:22px;
 color:#999;
 text-align:center;
 font-size:15px;
 line-height:1.5;
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<h1>📊 Pocket Broker Signal</h1>
<div class="sub">Technical Signal Analyzer</div>

<label>Asset</label>
<input id="asset" value="EUR/USD">

<label>Current Price</label>
<input id="price" type="number" step="any" value="1.0850">

<label>Previous Price</label>
<input id="prev" type="number" step="any" value="1.0840">

<label>RSI (0–100)</label>
<input id="rsi" type="number" min="0" max="100" step="any" value="50">

<label>EMA 9</label>
<input id="ema9" type="number" step="any" value="1.0850">

<label>EMA 21</label>
<input id="ema21" type="number" step="any" value="1.0840">

<label>Timeframe</label>
<select id="timeframe">
<option>1 MIN</option>
<option>5 MIN</option>
<option>15 MIN</option>
<option>30 MIN</option>
<option>1 HOUR</option>
</select>

<button onclick="analyze()">🔎 GENERATE SIGNAL</button>

<div id="result" class="result">
<div class="signal-title">Signal</div>
<div class="signal wait">WAIT</div>
<div class="conf">Enter values and generate signal</div>
</div>

<div class="grid">

<div class="box">
<span>Asset</span>
<strong id="outAsset">—</strong>
</div>

<div class="box">
<span>Timeframe</span>
<strong id="outTime">—</strong>
</div>

<div class="box">
<span>RSI</span>
<strong id="outRSI">—</strong>
</div>

<div class="box">
<span>Trend</span>
<strong id="outTrend">—</strong>
</div>

</div>

<div class="note">
⚠️ Technical analysis only. Signals are not guaranteed profits.
</div>

</div>
</div>

<script>

function analyze(){

 const asset = document.getElementById("asset").value.trim();

 const p = parseFloat(
   document.getElementById("price").value
 );

 const prev = parseFloat(
   document.getElementById("prev").value
 );

 const rsi = parseFloat(
   document.getElementById("rsi").value
 );

 const ema9 = parseFloat(
   document.getElementById("ema9").value
 );

 const ema21 = parseFloat(
   document.getElementById("ema21").value
 );

 const timeframe =
   document.getElementById("timeframe").value;

 if(
   !asset ||
   !Number.isFinite(p) ||
   !Number.isFinite(prev) ||
   !Number.isFinite(rsi) ||
   !Number.isFinite(ema9) ||
   !Number.isFinite(ema21) ||
   rsi < 0 ||
   rsi > 100
 ){
   document.getElementById("result").innerHTML = `
     <div class="signal-title">⚠️ Error</div>
     <div class="signal wait" style="font-size:30px">
       ENTER ALL VALUES
     </div>
   `;
   return;
 }

 let score = 0;

 /* PRICE MOMENTUM */
 if(p > prev){
   score += 1;
 }else if(p < prev){
   score -= 1;
 }

 /* EMA TREND */
 if(ema9 > ema21){
   score += 2;
 }else if(ema9 < ema21){
   score -= 2;
 }

 /* RSI */
 if(rsi >= 50 && rsi < 70){
   score += 1;
 }else if(rsi <= 50 && rsi > 30){
   score -= 1;
 }

 /* Avoid extreme RSI */
 if(rsi >= 70){
   score -= 1;
 }

 if(rsi <= 30){
   score += 1;
 }

 let signal;
 let cls;
 let confidence;

 if(score >= 3){

   signal = "CALL";
   cls = "call";

   confidence = Math.min(
     95,
     60 + (score - 3) * 8
   );

 }else if(score <= -3){

   signal = "PUT";
   cls = "put";

   confidence = Math.min(
     95,
     60 + (Math.abs(score) - 3) * 8
   );

 }else{

   signal = "WAIT";
   cls = "wait";

   confidence = 50 + Math.abs(score) * 3;
 }

 let trend;

 if(ema9 > ema21){
   trend = "UP";
 }else if(ema9 < ema21){
   trend = "DOWN";
 }else{
   trend = "SIDEWAYS";
 }

 document.getElementById("result").innerHTML = `
   <div class="signal-title">Signal</div>

   <div class="signal ${cls}">
     ${signal}
   </div>

   <div class="conf">
     Confidence: ${confidence}%
   </div>
 `;

 document.getElementById("outAsset").textContent =
   asset;

 document.getElementById("outTime").textContent =
   timeframe;

 document.getElementById("outRSI").textContent =
   rsi;

 document.getElementById("outTrend").textContent =
   trend;
}

</script>

</body>
</html>
