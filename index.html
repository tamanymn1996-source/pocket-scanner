<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Pocket Signal</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#0f1115;
 color:#fff;
 font-family:Arial,sans-serif
}
.wrap{
 max-width:520px;
 margin:auto;
 padding:18px
}
.card{
 background:#191d24;
 border:1px solid #303640;
 border-radius:18px;
 padding:18px
}
h1{text-align:center;margin:8px 0}
.sub{text-align:center;color:#aaa;margin-bottom:18px}

label{
 display:block;
 color:#bbb;
 margin:12px 0 6px
}

input,select,button{
 width:100%;
 padding:13px;
 border-radius:11px;
 border:1px solid #39404c;
 font-size:16px
}

input,select{
 background:#0f1115;
 color:#fff
}

button{
 margin-top:16px;
 background:#2563eb;
 color:#fff;
 border:0;
 font-weight:bold
}

.signal{
 margin-top:18px;
 text-align:center;
 padding:22px;
 border-radius:15px;
 background:#0f1115
}

.signal b{
 font-size:34px;
 display:block;
 margin:8px
}

.up{color:#22c55e}
.down{color:#ef4444}
.wait{color:#f59e0b}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin-top:14px
}

.box{
 background:#0f1115;
 padding:12px;
 border-radius:10px;
 text-align:center;
 color:#aaa
}

.box strong{
 display:block;
 color:#fff;
 font-size:17px;
 margin-top:4px
}

.status{
 text-align:center;
 margin-top:12px;
 color:#60a5fa
}

small{
 display:block;
 color:#888;
 text-align:center;
 margin-top:14px;
 line-height:1.5
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<h1>📊 Auto Pocket Signal</h1>
<div class="sub">Live 1-Minute Technical Signal</div>

<label>🔑 Twelve Data API Key</label>
<input id="apiKey" type="password" placeholder="Paste your API key">

<label>💱 Asset</label>
<select id="asset">
<option value="EUR/USD">EUR/USD</option>
<option value="GBP/USD">GBP/USD</option>
<option value="USD/JPY">USD/JPY</option>
<option value="AUD/USD">AUD/USD</option>
<option value="USD/CAD">USD/CAD</option>
<option value="USD/CHF">USD/CHF</option>
</select>

<button onclick="startAuto()">▶ START AUTO SIGNAL</button>

<div class="signal" id="signal">
WAITING...
</div>

<div class="grid">

<div class="box">
Price
<strong id="price">—</strong>
</div>

<div class="box">
Asset
<strong id="a">—</strong>
</div>

<div class="box">
RSI
<strong id="rsi">—</strong>
</div>

<div class="box">
EMA 9
<strong id="ema9">—</strong>
</div>

<div class="box">
EMA 21
<strong id="ema21">—</strong>
</div>

<div class="box">
Trend
<strong id="trend">—</strong>
</div>

</div>

<div class="status" id="status">
Not started
</div>

<small>
⚠️ Signals are technical estimates only and are not guaranteed profits.
</small>

</div>
</div>

<script>

let timer = null;

function calculateEMA(values, period){

    if(values.length < period) return null;

    let multiplier = 2 / (period + 1);

    let ema = values
        .slice(0, period)
        .reduce((a,b)=>a+b,0) / period;

    for(let i=period;i<values.length;i++){
        ema = ((values[i]-ema)*multiplier)+ema;
    }

    return ema;
}


function calculateRSI(values, period=14){

    if(values.length < period+1) return null;

    let gains = 0;
    let losses = 0;

    for(let i=1;i<=period;i++){

        let diff = values[i]-values[i-1];

        if(diff >= 0){
            gains += diff;
        }else{
            losses += Math.abs(diff);
        }
    }

    let avgGain = gains / period;
    let avgLoss = losses / period;

    for(let i=period+1;i<values.length;i++){

        let diff = values[i]-values[i-1];

        let gain = diff > 0 ? diff : 0;
        let loss = diff < 0 ? Math.abs(diff) : 0;

        avgGain = ((avgGain*(period-1))+gain)/period;
        avgLoss = ((avgLoss*(period-1))+loss)/period;
    }

    if(avgLoss === 0) return 100;

    let rs = avgGain / avgLoss;

    return 100 - (100/(1+rs));
}


async function getData(){

    const key = document.getElementById("apiKey").value.trim();
    const asset = document.getElementById("asset").value;

    if(!key){
        document.getElementById("signal").innerHTML =
        '<span class="wait">⚠️ API KEY پێویستە</span>';
        return;
    }

    document.getElementById("status").textContent =
    "🔄 Getting live market data...";

    try{

        const url =
        "https://api.twelvedata.com/time_series" +
        "?symbol="+encodeURIComponent(asset) +
        "&interval=1min" +
        "&outputsize=100" +
        "&timezone=UTC" +
        "&apikey="+encodeURIComponent(key);

        const response = await fetch(url);

        const data = await response.json();

        if(data.status === "error"){

            throw new Error(data.message || "API error");
        }

        if(!data.values || data.values.length < 30){

            throw new Error("Not enough candle data");
        }

        /*
          Twelve Data returns newest candle first.
          We skip candle 0 because it may still be forming.
        */

        const candles = data.values.slice(1);

        const closes = candles
            .map(x => Number(x.close))
            .reverse();

        const currentPrice =
            Number(candles[0].close);

        const ema9 =
            calculateEMA(closes,9);

        const ema21 =
            calculateEMA(closes,21);

        const rsi =
            calculateRSI(closes,14);

        if(ema9 === null || ema21 === null || rsi === null){

            throw new Error("Indicator calculation failed");
        }

        let score = 0;

        // EMA trend
        if(ema9 > ema21){
            score += 1;
        }else if(ema9 < ema21){
            score -= 1;
        }

        // RSI
        if(rsi >= 50 && rsi < 70){
            score += 1;
        }

        if(rsi <= 50 && rsi > 30){
            score -= 1;
        }

        // Price vs EMA21
        if(currentPrice > ema21){
            score += 1;
        }else if(currentPrice < ema21){
            score -= 1;
        }

        let signal = "WAIT";
        let className = "wait";
        let confidence = 55;

        if(score >= 2){

            signal = "CALL";
            className = "up";
            confidence = 70 + Math.min(score-2,2)*5;

        }else if(score <= -2){

            signal = "PUT";
            className = "down";
            confidence = 70 + Math.min(Math.abs(score)-2,2)*5;
        }

        document.getElementById("signal").innerHTML =
        '<div>NEW SIGNAL</div>' +
        '<b class="'+className+'">' +
        (signal==="CALL" ? "🟢 " :
         signal==="PUT" ? "🔴 " : "🟡 ") +
        signal +
        '</b>' +
        '<div>Confidence: '+confidence+'%</div>';

        document.getElementById("price").textContent =
        currentPrice.toFixed(5);

        document.getElementById("a").textContent =
        asset;

        document.getElementById("rsi").textContent =
        rsi.toFixed(1);

        document.getElementById("ema9").textContent =
        ema9.toFixed(5);

        document.getElementById("ema21").textContent =
        ema21.toFixed(5);

        document.getElementById("trend").textContent =
        ema9 > ema21 ? "UP" :
        ema9 < ema21 ? "DOWN" : "SIDEWAYS";

        document.getElementById("status").textContent =
        "🟢 Live • Updated: " +
        new Date().toLocaleTimeString();

    }catch(error){

        document.getElementById("status").textContent =
        "❌ "+error.message;

        document.getElementById("signal").innerHTML =
        '<span class="wait">⚠️ DATA ERROR</span>';
    }
}


function startAuto(){

    if(timer){
        clearInterval(timer);
    }

    getData();

    /*
      Update every 60 seconds.
    */

    timer = setInterval(getData,60000);

    document.getElementById("status").textContent =
    "🟢 AUTO SIGNAL STARTED";
}

</script>

</body>
</html>
