<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pocket Broker Signal</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0f1115;
  color:#fff;
  font-family:Arial,sans-serif
}

.wrap{
  max-width:520px;
  margin:auto;
  padding:18px
}

.card{
  background:#191d24;
  border:1px solid #303640;
  border-radius:18px;
  padding:18px
}

h1{
  text-align:center;
  margin:8px 0 4px
}

.sub{
  text-align:center;
  color:#aaa;
  margin-bottom:18px
}

label{
  display:block;
  color:#bbb;
  margin:12px 0 6px
}

input,select,button{
  width:100%;
  padding:15px;
  border-radius:11px;
  border:1px solid #39404c;
  font-size:17px
}

input,select{
  background:#0f1115;
  color:#fff
}

button{
  margin-top:16px;
  background:#2563eb;
  color:#fff;
  border:0;
  font-weight:bold;
  cursor:pointer
}

button:active{
  transform:scale(.98)
}

.signal{
  margin-top:18px;
  text-align:center;
  padding:20px;
  border-radius:15px;
  background:#0f1115
}

.signal b{
  font-size:38px;
  display:block;
  margin:8px
}

.up{
  color:#22c55e
}

.down{
  color:#ef4444
}

.wait{
  color:#f59e0b
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px
}

.box{
  background:#0f1115;
  padding:14px;
  border-radius:10px;
  text-align:center;
  color:#bbb
}

.box strong{
  display:block;
  color:#fff;
  font-size:19px;
  margin-top:5px
}

small{
  display:block;
  color:#888;
  text-align:center;
  margin-top:14px;
  line-height:1.5
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<h1>📊 Pocket Broker Signal</h1>

<div class="sub">
Simple technical signal analyzer
</div>

<label>Asset</label>
<input id="asset" value="EUR/USD">

<label>Current Price</label>
<input id="price" type="number" step="any" placeholder="1.0850">

<label>Previous Price</label>
<input id="prev" type="number" step="any" placeholder="1.0840">

<label>RSI (0–100)</label>
<input id="rsi" type="number" min="0" max="100" value="50">

<label>EMA 9</label>
<input id="ema9" type="number" step="any" placeholder="1.0850">

<label>EMA 21</label>
<input id="ema21" type="number" step="any" placeholder="1.0840">

<label>Timeframe</label>

<select id="tf">
<option>1 MIN</option>
<option>5 MIN</option>
<option>15 MIN</option>
</select>

<button onclick="analyze()">
🔎 GENERATE SIGNAL
</button>

<div class="signal" id="signal">
Result will appear here
</div>

<div class="grid">

<div class="box">
Asset
<strong id="a">—</strong>
</div>

<div class="box">
Timeframe
<strong id="t">—</strong>
</div>

<div class="box">
RSI
<strong id="r">—</strong>
</div>

<div class="box">
Trend
<strong id="trend">—</strong>
</div>

</div>

<small>
⚠️ Technical analysis only; signals are not guaranteed profits.
</small>

</div>
</div>

<script>

function analyze(){

const asset = document.getElementById("asset");
const price = document.getElementById("price");
const prev = document.getElementById("prev");
const rsi = document.getElementById("rsi");
const ema9 = document.getElementById("ema9");
const ema21 = document.getElementById("ema21");
const tf = document.getElementById("tf");

const signal = document.getElementById("signal");
const a = document.getElementById("a");
const t = document.getElementById("t");
const r = document.getElementById("r");
const trend = document.getElementById("trend");

const p = Number(price.value);
const pr = Number(prev.value);
const rv = Number(rsi.value);
const e9 = Number(ema9.value);
const e21 = Number(ema21.value);

if(
  !asset.value ||
  !Number.isFinite(p) ||
  !Number.isFinite(pr) ||
  !Number.isFinite(rv) ||
  !Number.isFinite(e9) ||
  !Number.isFinite(e21)
){

signal.innerHTML =
'<span class="wait">⚠️ Enter all values</span>';

return;
}

if(rv < 0 || rv > 100){

signal.innerHTML =
'<span class="wait">⚠️ RSI must be between 0 and 100</span>';

return;
}

/*
Signal scoring

Price > Previous = bullish
EMA9 > EMA21 = bullish
RSI 50-70 = bullish
RSI 30-50 = bearish
*/

let score = 0;

if(p > pr){
score++;
}else if(p < pr){
score--;
}

if(e9 > e21){
score++;
}else if(e9 < e21){
score--;
}

if(rv > 50 && rv < 70){
score++;
}else if(rv < 50 && rv > 30){
score--;
}

let txt = "WAIT";
let cls = "wait";
let confidence = 55;

if(score >= 2){

txt = "CALL";
cls = "up";
confidence = 70;

}else if(score <= -2){

txt = "PUT";
cls = "down";
confidence = 70;

}else if(score === 1){

txt = "CALL";
cls = "up";
confidence = 60;

}else if(score === -1){

txt = "PUT";
cls = "down";
confidence = 60;
}

/* Result */

signal.innerHTML =
'<div>Signal</div>' +
'<b class="' + cls + '">' +
(txt === "CALL" ? "🟢 " :
 txt === "PUT" ? "🔴 " : "🟡 ") +
txt +
'</b>' +
'<div>Confidence: ' +
confidence +
'%</div>';

/* Information boxes */

a.textContent = asset.value;
t.textContent = tf.value;
r.textContent = rv;

if(score > 0){
trend.textContent = "UP";
trend.className = "up";
}else if(score < 0){
trend.textContent = "DOWN";
trend.className = "down";
}else{
trend.textContent = "SIDEWAYS";
trend.className = "";
}

}

</script>

</body>
</html>
