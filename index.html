<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pocket Broker OTC Signal</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#fff;font-family:Arial;padding:12px}
.box{max-width:700px;margin:auto;background:#151c31;padding:15px;border-radius:18px}
h2{text-align:center}
select,input,button{width:100%;padding:13px;margin:6px 0;border:0;border-radius:12px;background:#242d48;color:#fff}
button{background:#18a66b;font-weight:bold}
.price{text-align:center;font-size:38px;font-weight:bold;margin:15px}
.signal{text-align:center;padding:20px;border-radius:16px;font-size:28px;font-weight:bold}
.wait{background:#30384d}.up{background:#075c3b}.down{background:#6b1824}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.m{background:#0e1528;padding:12px;text-align:center;border-radius:12px}
small{color:#9da8c2}
table{width:100%;margin-top:12px;font-size:12px}
td,th{padding:7px;border-bottom:1px solid #29334e}
</style>
</head>
<body>
<div class="box">

<h2>⚡ Pocket Broker OTC</h2>

<select id="asset">
<option>EUR/USD OTC</option>
<option>GBP/USD OTC</option>
<option>USD/JPY OTC</option>
<option>AUD/USD OTC</option>
<option>USD/CAD OTC</option>
<option>USD/CHF OTC</option>
<option>EUR/JPY OTC</option>
<option>EUR/GBP OTC</option>
<option>GBP/JPY OTC</option>
<option>AUD/JPY OTC</option>
<option>NZD/USD OTC</option>
<option>NZD/JPY OTC</option>
<option>CAD/JPY OTC</option>
<option>EUR/CHF OTC</option>
<option>AUD/CHF OTC</option>
<option>AUD/NZD OTC</option>
<option>USD/SGD OTC</option>
<option>USD/MXN OTC</option>
<option>USD/TRY OTC</option>
<option>USD/ZAR OTC</option>
<option>USD/INR OTC</option>
<option>USD/PKR OTC</option>
<option>USD/PHP OTC</option>
<option>USD/COP OTC</option>
<option>USD/BRL OTC</option>
<option>USD/EGP OTC</option>
<option>USD/THB OTC</option>
<option>USD/VND OTC</option>
<option>USD/IDR OTC</option>
<option>USD/CLP OTC</option>
<option>Gold OTC</option>
</select>

<div class="price" id="price">—</div>
<div id="status">Waiting for Pocket Broker OTC feed...</div>

<div id="signal" class="signal wait">WAIT</div>

<div class="grid">
<div class="m"><small>RSI</small><br><b id="rsi">—</b></div>
<div class="m"><small>MACD</small><br><b id="macd">—</b></div>
<div class="m"><small>EMA</small><br><b id="ema">—</b></div>
<div class="m"><small>Momentum</small><br><b id="mom">—</b></div>
<div class="m"><small>Pattern</small><br><b id="pattern">—</b></div>
<div class="m"><small>Confidence</small><br><b id="conf">—</b></div>
</div>

<h3>Win / Loss</h3>
<div class="grid">
<div class="m">WIN<br><b id="win">0</b></div>
<div class="m">LOSS<br><b id="loss">0</b></div>
<div class="m">RATE<br><b id="rate">0%</b></div>
</div>

<table>
<thead><tr><th>Time</th><th>Signal</th><th>Entry</th><th>Result</th></tr></thead>
<tbody id="history"></tbody>
</table>

<br>
<button onclick="clearAll()">Clear History</button>

<p style="font-size:11px;color:#9da8c2">
OTC price must come from an authorized Pocket Broker feed.
This application does not invent prices or guarantee profits.
</p>

</div>

<script>
let p=[];
let history=JSON.parse(localStorage.history||"[]");

function ema(a,n){
 if(a.length<n)return null;
 let e=a.slice(0,n).reduce((x,y)=>x+y,0)/n,k=2/(n+1);
 for(let i=n;i<a.length;i++)e=a[i]*k+e*(1-k);
 return e;
}

function rsi(a,n=14){
 if(a.length<n+1)return null;
 let g=0,l=0;
 for(let i=a.length-n;i<a.length;i++){
  let d=a[i]-a[i-1];
  if(d>0)g+=d;else l-=d;
 }
 return l?100-(100/(1+g/l)):100;
}

function analyze(){
 if(p.length<30)return;
 let a=p.map(x=>x.price),e9=ema(a,9),e21=ema(a,21);
 let R=rsi(a),bull=0,bear=0;

 if(e9>e21)bull+=2;else bear+=2;
 if(a.at(-1)>e21)bull++;else bear++;
 if(R>52&&R<68)bull++;
 if(R>32&&R<48)bear++;
 if(a.at(-1)>a.at(-2))bull++;else bear++;
 if(a.at(-1)>a.at(-6))bull++;else bear++;

 let diff=bull-bear;
 let s="WAIT";

 if(bull>=5&&diff>=3&&R<70)s="HIGHER";
 if(bear>=5&&diff<=-3&&R>30)s="LOWER";

 let c=s=="WAIT"?50:Math.min(94,70+Math.abs(diff)*5);

 document.getElementById("rsi").textContent=R.toFixed(1);
 document.getElementById("ema").textContent=e9.toFixed(5);
 document.getElementById("mom").textContent=(a.at(-1)-a.at(-2)).toFixed(5);
 document.getElementById("macd").textContent=(ema(a,12)-ema(a,26)).toFixed(5);
 document.getElementById("pattern").textContent=
   a.at(-1)>a.at(-5)?"UP TREND":"DOWN TREND";
 document.getElementById("conf").textContent=c+"%";

 let box=document.getElementById("signal");
 box.textContent=s;
 box.className="signal "+(s=="HIGHER"?"up":s=="LOWER"?"down":"wait");
}

function addPocketPrice(){
 let v=prompt("Pocket Broker OTC price:");
 if(v===null)return;
 v=parseFloat(v);
 if(!isFinite(v)||v<=0)return;
 p.push({price:v,time:Date.now()});
 if(p.length>500)p.shift();
 document.getElementById("price").textContent=v;
 document.getElementById("status").textContent=
   "Pocket Broker price captured • "+new Date().toLocaleTimeString();
 analyze();
}

function render(){
 let w=history.filter(x=>x.r=="WIN").length;
 let l=history.filter(x=>x.r=="LOSS").length;
 document.getElementById("win").textContent=w;
 document.getElementById("loss").textContent=l;
 document.getElementById("rate").textContent=
   (w+l?Math.round(w/(w+l)*100):0)+"%";
 document.getElementById("history").innerHTML=
 history.slice(-10).reverse().map(x=>
 `<tr><td>${x.t}</td><td>${x.s}</td>
 <td>${x.e}</td><td>${x.r}</td></tr>`).join("");
}

function clearAll(){
 if(confirm("Clear history?")){
  history=[];localStorage.removeItem("history");render();
 }
}

document.getElementById("price").onclick=addPocketPrice;
render();
</script>
</body>
</html>
