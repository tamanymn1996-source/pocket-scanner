<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Scanner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1115;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .scanner {
      background: #191d24;
      border: 1px solid #303640;
      border-radius: 18px;
      padding: 20px;
      text-align: center;
    }

    .preview {
      height: 280px;
      border: 2px dashed #555;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #238636;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #2ea043;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #11151b;
      border-radius: 12px;
      min-height: 50px;
      color: #ccc;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>📷 Pocket Scanner</h1>

    <div class="subtitle">
      Simple document scanner
    </div>

    <div class="scanner">

      <div class="preview" id="preview">
        Camera preview
      </div>

      <button onclick="startScanner()">
        Start Scanner
      </button>

      <div id="result">
        Scanner ready.
      </div>

    </div>

  </div>

  <script>
    function startScanner() {
      document.getElementById("result").innerText =
        "Scanner started. Camera feature will be added next.";
    }
  </script>

</body>
</html>
